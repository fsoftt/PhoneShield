name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore Tranqui.Backend.slnf
      - run: dotnet build Tranqui.Backend.slnf --no-restore --configuration Release
      - run: dotnet test Tranqui.Backend.slnf --no-build --configuration Release

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --file src/Api/Dockerfile --tag tranqui-api:ci .
      - run: docker build --file src/BackOffice/Dockerfile --tag tranqui-backoffice:ci .

  android:
    name: Android app build (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: dotnet workload install maui-android
      - name: Install Android SDK dependencies
        run: >
          dotnet build src/App/Tranqui.App.csproj -t:InstallAndroidDependencies
          -f net10.0-android
          -p:AndroidSdkDirectory=$ANDROID_HOME
          -p:AcceptAndroidSDKLicenses=True
      - run: >
          dotnet build src/App/Tranqui.App.csproj
          -f net10.0-android
          --configuration ${{ matrix.configuration }}
          -p:AndroidSdkDirectory=$ANDROID_HOME
