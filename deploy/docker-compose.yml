# Production: API + PostgreSQL behind Caddy (automatic HTTPS). See deploy/README.md.
services:
  api:
    build:
      context: ..
      dockerfile: src/Api/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=tranqui;Username=tranqui;Password=${POSTGRES_PASSWORD:?}"
      Firebase__ProjectId: ${FIREBASE_PROJECT_ID:?}
      PhoneHashing__CurrentKeyVersion: ${PHONE_HASHING_CURRENT_KEY_VERSION:-1}
      PhoneHashing__Keys__1: ${PHONE_HASHING_KEY_1:?}
      NameProtection__Key: ${NAME_PROTECTION_KEY:?}
      ContributorIds__Key: ${CONTRIBUTOR_IDS_KEY:?}
      # Optional: without it the appeal endpoints reject every request.
      PlayIntegrity__ServiceAccountKey: ${PLAY_INTEGRITY_SERVICE_ACCOUNT_KEY:-}
      BackOffice__AdminUids__0: ${BACK_OFFICE_ADMIN_UID:-}
    depends_on:
      postgres:
        condition: service_healthy

  # Back office (Blazor, server-rendered). Talks to the API over the internal network; reachable only through Caddy.
  backoffice:
    build:
      context: ..
      dockerfile: src/BackOffice/Dockerfile
    restart: unless-stopped
    environment:
      BackOffice__ApiBaseUrl: http://api:8080/
      BackOffice__FirebaseApiKey: ${FIREBASE_WEB_API_KEY:?}
    volumes:
      - backoffice-keys:/data-protection
    depends_on:
      - api

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tranqui
      POSTGRES_USER: tranqui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tranqui -d tranqui"]
      interval: 10s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TRANQUI_DOMAIN: ${TRANQUI_DOMAIN:?}
      TRANQUI_ADMIN_DOMAIN: ${TRANQUI_ADMIN_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api
      - backoffice

volumes:
  postgres-data:
  caddy-data:
  backoffice-keys:
