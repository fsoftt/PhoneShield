<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Tranqui · Back office</title>
  <link rel="stylesheet" href="admin.css">
  <script src="admin.js" defer></script>
</head>
<body>
  <header class="bar">
    <strong>Tranqui</strong> <span data-i18n="title"></span>
    <button id="sign-out" class="link" hidden data-i18n="signOut"></button>
  </header>

  <main>
    <p id="message" role="status" aria-live="polite"></p>

    <form id="sign-in" class="card narrow" hidden>
      <h1 data-i18n="signInTitle"></h1>
      <label><span data-i18n="email"></span><input id="email" type="email" autocomplete="username" required></label>
      <label><span data-i18n="password"></span><input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" data-i18n="signIn"></button>
    </form>

    <section id="dashboard" hidden>
      <h1 data-i18n="overview"></h1>
      <dl id="overview" class="stats"></dl>

      <section class="card">
        <h2 data-i18n="retentionTitle"></h2>
        <p data-i18n="retentionText"></p>
        <button id="purge" data-i18n="purge"></button>
      </section>

      <h2 data-i18n="appeals"></h2>
      <div class="tabs" role="tablist">
        <button role="tab" data-status="Pending" data-i18n="pending"></button>
        <button role="tab" data-status="Approved" data-i18n="approved"></button>
        <button role="tab" data-status="Rejected" data-i18n="rejected"></button>
        <button role="tab" data-status="Applied" data-i18n="applied"></button>
      </div>
      <p class="hint" data-i18n="privacyHint"></p>
      <div id="appeals"></div>
    </section>
  </main>
</body>
</html>
